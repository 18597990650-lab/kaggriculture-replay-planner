[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-replay-planner"
version = "0.1.0"
description = "Standardized project wrapper for a Kaggriculture planning agent."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
kaggle = ["kaggle==2.2.4"]
build = ["Cython==3.2.9", "setuptools>=69"]

[project.scripts]
kaggriculture-planner = "kaggriculture_planner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
